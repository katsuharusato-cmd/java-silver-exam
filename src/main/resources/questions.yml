# =====================================================================
# questions.yml — Java Silver 模擬試験 問題データ
# ---------------------------------------------------------------------
# ここに問題を追加・編集してください。1問につき以下の形式です。
#
# - id: 1                      # 問題を一意に識別する番号（重複しないこと）
#   category: 1                # 分野番号（数値）。分野名との対応は
#                               # com.exam.silver.model.ExamCategory を参照・編集してください。
#   description: |             # 問題文。複数行OK（| の後に改行してインデント）
#     次のコードをコンパイル、実行した結果として正しいものを選びなさい。
#   code: |                    # ソースコード（無い問題は code 行ごと削除してOK）
#     public class Sample {
#         public static void main(String[] args) {
#             System.out.println("Hello");
#         }
#     }
#   options:                   # 選択肢（idはa,b,c...で統一）
#     - id: a
#       text: "Hello と表示される"
#     - id: b
#       text: "コンパイルエラーになる"
#     - id: c
#       text: "実行時に例外がスローされる"
#     - id: d
#       text: "何も表示されない"
#   answers: [a]                # 正解の選択肢id（複数正解の場合は [a, c] のように書く）
#
# ※ answers に複数のidを書くと、自動的に「複数選択問題」として扱われます
#   （選択できる最大数 = 正解の数、になります）。
#
# 分野番号の対応（ExamCategory.javaで変更可能。Java Silver試験の出題範囲に準拠）：
#   1: Javaの概要と簡単なJavaプログラムの作成
#   2: Javaの基本データ型と文字列の操作
#   3: 演算子と制御構造
#   4: クラスの定義とインスタンスの使用
#   5: 継承とインタフェースの使用
#   6: 例外処理
# =====================================================================
